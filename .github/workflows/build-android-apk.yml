name: Build VRRON Android APK

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["VRRON Core Checks"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

jobs:
  build-apk:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    name: Build preview APK with Expo EAS
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Link EAS project if needed
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Add an Expo access token as the repository Actions secret EXPO_TOKEN."
            exit 1
          fi
          npx eas-cli@latest init --force --non-interactive
      - name: Save EAS project link
        run: |
          if ! git diff --quiet -- apps/mobile/app.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps/mobile/app.json
            git commit -m "Link mobile app to EAS project"
            git push
          fi
      - name: Build Android APK
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli@latest build --platform android --profile preview --non-interactive --wait
