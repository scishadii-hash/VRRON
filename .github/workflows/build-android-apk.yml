name: Build VRRON Android APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    name: Build preview APK with Expo EAS
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build Android APK
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Add an Expo access token as the repository Actions secret EXPO_TOKEN."
            exit 1
          fi
          npx eas-cli@latest build --platform android --profile preview --non-interactive --wait
