name: Unpack VRRON Phase 1.1
on:
  push:
    paths:
      - "vrron-phase-1.1.zip"
      - "vrron-phase-1.1-fixed.zip"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Validate and unpack archive
        run: |
          archive=""
          if [ -f vrron-phase-1.1-fixed.zip ]; then
            archive="vrron-phase-1.1-fixed.zip"
          elif [ -f vrron-phase-1.1.zip ]; then
            archive="vrron-phase-1.1.zip"
          else
            echo "Phase 1.1 ZIP not found"
            exit 1
          fi
          if unzip -Z1 "$archive" | grep -E '(^/|(^|/)\.\.(\/|$))'; then
            echo "Unsafe archive path detected"
            exit 1
          fi
          unzip -o "$archive" -d .
          rm "$archive"
      - name: Commit extracted project files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract VRRON Phase 1.1 project files" || echo "No changes to commit"
          git push
