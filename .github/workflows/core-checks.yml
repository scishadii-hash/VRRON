name: VRRON Core Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.0"
          cache: npm

      - name: Install workspace dependencies
        run: npm install --no-audit --no-fund

      - name: Validate repository configuration
        run: npm run check

      - name: Run API and design tests
        run: npm test

      - name: Type-check API, contract, and design packages
        run: |
          npm run typecheck --workspace=@vrron/api
          npm run typecheck --workspace=@vrron/contract
          npm run typecheck --workspace=@vrron/design
